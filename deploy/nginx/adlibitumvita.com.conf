# Ad Libitum Vita — nginx vhost.
# Install: sudo ln -s /path/to/this/file /etc/nginx/sites-enabled/adlibitumvita.com
# then: sudo nginx -t && sudo systemctl reload nginx
#
# Does not touch any other site's config. TLS/Let's Encrypt directives should
# be added following this host's existing certbot convention (inspect
# /etc/nginx/sites-available/* on other vhosts for the exact pattern in use).

upstream adlibitumvita_app {
  server 127.0.0.1:3211;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name adlibitumvita.com www.adlibitumvita.com;

  client_max_body_size 30m;

  location / {
    proxy_pass http://adlibitumvita_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location = /api/health {
    proxy_pass http://adlibitumvita_app;
    access_log off;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# Ad Libitum Vita — canonical-host nginx vhost, installed AFTER certbot has
# issued the adlibitumvita.com certificate (deploy/bootstrap-host.sh swaps
# this in once /etc/letsencrypt/live/adlibitumvita.com/fullchain.pem exists).
#
# Canonical origin is https://adlibitumvita.com. Plain HTTP and the www host
# both redirect to it. Does not touch any other site's config.
#
# If you ever need to hand-edit this instead of letting the bootstrap script
# manage it: sudo nginx -t && sudo systemctl reload nginx, always.

upstream adlibitumvita_app {
  server 127.0.0.1:3211;
  keepalive 8;
}

# Plain HTTP (both hosts) -> canonical HTTPS apex.
server {
  listen 80;
  listen [::]:80;
  server_name adlibitumvita.com www.adlibitumvita.com;

  return 301 https://adlibitumvita.com$request_uri;
}

# www over HTTPS -> canonical HTTPS apex.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.adlibitumvita.com;

  ssl_certificate     /etc/letsencrypt/live/adlibitumvita.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/adlibitumvita.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://adlibitumvita.com$request_uri;
}

# Canonical HTTPS apex — proxies to the app.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name adlibitumvita.com;

  ssl_certificate     /etc/letsencrypt/live/adlibitumvita.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/adlibitumvita.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 30m;

  location / {
    proxy_pass http://adlibitumvita_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location = /api/health {
    proxy_pass http://adlibitumvita_app;
    access_log off;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
